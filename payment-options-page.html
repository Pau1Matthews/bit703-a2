<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa Adventure Gear</title>
  <link rel="stylesheet" href="css/generic-styles.css">
  <link rel="stylesheet" href="css/payment-options-page.css">
  <script src="js/payment-script" defer></script>
</head>
<body>

  <header class="top-nav">
    <!-- Left: Logo Placeholder -->
    <div class="logo">
       <img src="images/BIT703-A2-01-AotearoaAdventureGearLogo-Graphic-2025-04.png" alt="Company logo">
    </div>


    <!-- Right: Nav Links-->
    <div class="nav-right">
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <span class="divider">|</span>
        <a href="#">About</a>
        <span class="divider">|</span>
        <a href="shop-page.html">Shop</a>
        <span class="divider">|</span>
        <a href="#">Help</a>
      </nav>
      
      <!-- Cart Button -->
      <a href="#" class="cart-btn">
        <img src="images/cart.svg" alt=""> Your Cart
      </a>
    </div>
  </header>

  <main class="main">

    <!-- Checkout status banner -->

    <div class="checkout-page-status">
      <div class="status-card-other">
        <h2>1.Shopping Cart</h2>
      </div>
      <div class="status-card-other">
        <h2>2. Shipping Details</h2>
      </div>
      <div class="status-card-current">
        <h2>3. Payment Options</h2>
      </div>  
    </div>

    <div class="payment-grid">
      <div class="payment-details-column">
        <div class="payment-title">
          <h1>Payment method</h1>
        </div>

        <form id="payment-form" class="payment-form">
          <div class="credit-card-container">
            <label class="payment-box label-active" id="credit-card-box" >
                <input type="radio" name="payment-method" value="credit" checked>
                <div class="checkbox-content">
                    <span class="title">Credit Card</span>
                    <span class="subtext">lorem ipsum dolor sit amet consectetur adipiscing elit lorem irure nulla</span>
                </div>
            </label>


            <div class="form-row-three-columns">
              <input type="text" id="card-number" placeholder="0000 0000 0000 0000" required>
              <input type="text" id="card-expiry-date" placeholder="MM/YY" maxlength="5" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" required>
              <input type="text" id="card-cw" placeholder="CW" required>
            </div>
            <div class="form-row">
              <input type="text" id="card-holder-name" placeholder="Card Holder Name" required>
            </div>
          </div>

          <div class="line-divider">

          </div>

          <div class="paypal-container">
            <label class="payment-box" id="paypal-box">
                <input type="radio" name="payment-method" value="paypal">
                <div class="checkbox-content">
                    <span class="title">Paypal</span>
                    <span class="subtext">lorem ipsum dolor sit amet consectetur adipiscing elit lorem irure nulla</span>
                </div>
            </label>
          </div>

          <div class="line-divider">

          </div>


          <!-- Navigation Buttons -->
          <div class="action-buttons">
            <div class="next-btn-container-large">
              <a href="index.html" class="next-btn-large">Pay Now</a>
            </div>

            <div class="cancel-btn-container-large">
              <button type="button" class="cancel-btn-large" onclick="history.back()">Cancel</button>
            </div>
          </div>

        </form>
      </div>

      <!-- Summary Column -->
      <div class="order-summary-column">
        <div class="summary-title">
          <h1>Summary</h1>
        </div>
        <div class="items-grid">
          <div class="order-item-image">
            <img src="images/05 waterproof_ski.jpg" alt="Ski Pants" width="100">
          </div>
          <div class="order-item-details">
            <h3>Ski Pants</h3>
            <h3><span>$<span class="item-total">199.00</span></span></h3>
          </div>
          <div class="order-item-image">
            <img src="images/02 hiking_boot.jpg" alt="Hiking Boots" width="100">
          </div>
          <div class="order-item-details">
            <h3>Hiking Boots</h3>
            <h3><span>$<span class="item-total">299.00</span></span></h3>
          </div>
        </div>
        <div class="voucher">
          <h3>HAVE A VOUCHER?</h3>
        </div>
        <div class="order-totals">
          <div class="amounts">
          <span>SUBTOTAL</span>
          <div class="subtotal-section">$<span id="sub-total"></span></div>
        </div>
        <div class="amounts">
          <span>SHIPPING</span>
          <div class="shipping-section">$<span id="shipping-total">50.00</span></div>
        </div>
        <div class="amounts">
          <span>TAXES</span>
          <div class="tax-section">$<span id="tax-total"></span></div>
        </div>
      
        <div class="amounts">
          <h1><span>TOTAL</span></h1>
          <div class="total-section">$<span id="grand-total"></span></div>
        </div>
      </div>
    </div>
  </div>


</main>

<!-- Footer -->
<footer class="footer">

  <div class="standard-footer-nav">
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <span class="divider">|</span>
      <a href="#">About</a>
      <span class="divider">|</span>
      <a href="shop-page.html">Shop</a>
      <span class="divider">|</span>
      <a href="#">Help</a>
  </div>

  <div class="standard-footer-trademark">
    <h4>&copy; Aotearoa Adventure Gear</h4>
  </div>
       
</footer>

</body>
</html>
