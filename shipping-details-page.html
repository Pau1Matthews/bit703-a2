<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa Adventure Gear</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/shipping-script.js" defer></script>
</head>
<body>

  <header class="top-nav">
    <!-- Left: Logo Placeholder -->
    <div class="logo">
       <img src="images/BIT703-A2-01-AotearoaAdventureGearLogo-Graphic-2025-04.png" alt="Company logo">
    </div>


    <!-- Right: Nav Links-->
    <div class="nav-right">
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <span class="divider">|</span>
        <a href="#">About</a>
        <span class="divider">|</span>
        <a href="shop-page.html">Shop</a>
        <span class="divider">|</span>
        <a href="#">Help</a>
      </nav>
      
      <!-- Cart Button -->
      <a href="shopping-cart-page.html" class="cart-btn">
        <img src="images/cart.svg" alt=""> Your Cart
      </a>
    </div>
  </header>

<main class="main">

  <!-- Checkout status banner -->

  <div class="checkout-page-status">
    <div class="status-card-other">
      <h2>1.Shopping Cart</h2>
    </div>
    <div class="status-card-current">
      <h2>2. Shipping Details</h2>
    </div>
    <div class="status-card-other">
      <h2>3. Payment Options</h2>
    </div>  
  </div>
   
  <div class="shipping-grid">
    <div class="shipping-details-column">
      <div class="shipping-title">
        <h1>Shipping Details</h1>
      </div>
      <div class="customer-form-container">
        <form id="form" class="form">
      <h2>Register With Us</h2>
      <div class="form-control">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username">
        <small>Error Message</small>
      </div>
      <div class="form-control">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Enter email">
        <small>Error Message</small>
      </div>
      <div class="form-control">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password">
        <small>Error Message</small>
      </div>
      <div class="form-control">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Enter password again">
        <small>Error Message</small>
      </div>
      <button>Register</button>
    </form>
      </div>
      <div class="shipping-selection">

      </div>
    </div>
    <div class="shipping-summary-column">
      <div class="summary-title">
        <h1>Summary</h1>
      </div>
      <div class="items-grid">
        <div class="shipping-item-image">

        </div>
        <div class="shipping-item-details">

        </div>
        <div class="voucher">

        </div>
        <div class="shipping-totals">

        </div>
        <div class="shipping-grand-total">

        </div>
      </div>
    </div>
  </div>

    


   <!-- Navigation Buttons -->
    
  <div class="action-buttons">
    <div class="next-btn-container-large">
      <a href="payment-options-page.html" class="next-btn-large">Next</a>
    </div>

    <div class="cancel-btn-container-large">
      <a href="shopping-cart-page.html" class="cancel-btn-large">Back</a>
    </div>
  </div> 


</main>

<!-- Footer -->

<footer class="footer">

  <div class="standard-footer-nav">

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <span class="divider">|</span>
        <a href="#">About</a>
        <span class="divider">|</span>
        <a href="shop-page.html">Shop</a>
        <span class="divider">|</span>
        <a href="#">Help</a>

  </div>

  <div class="standard-footer-trademark">
    <h4>&copy; Aotearoa Adventure Gear</h4>
  </div>
       
</footer>


</body>
</html>
