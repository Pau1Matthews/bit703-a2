<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aotearoa Adventure Gear</title>
  <link rel="stylesheet" href="css/common-styles.css">
  <link rel="stylesheet" href="css/shipping-details-page.css">
  <script src="js/shipping-script.js" defer></script>
</head>
<body>

  <header class="top-nav">
    <!-- Left: Logo Placeholder -->
    <div class="logo">
       <img src="images/BIT703-A2-01-AotearoaAdventureGearLogo-Graphic-2025-04.png" alt="Company logo">
    </div>


    <!-- Right: Nav Links-->
    <div class="nav-right">
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <span class="divider">|</span>
        <a href="#">About</a>
        <span class="divider">|</span>
        <a href="shop-page.html">Shop</a>
        <span class="divider">|</span>
        <a href="#">Help</a>
      </nav>
      
      <!-- Cart Button -->
      <a href="shopping-cart-page.html" class="cart-btn">
        <img src="images/cart.svg" alt=""> Your Cart
      </a>
    </div>
  </header>

<main class="main">

  <!-- Checkout status banner -->

  <div class="checkout-page-status">
    <div class="status-card-other">
      <h2>1.Shopping Cart</h2>
    </div>
    <div class="status-card-current">
      <h2>2. Shipping Details</h2>
    </div>
    <div class="status-card-other">
      <h2>3. Payment Options</h2>
    </div>  
  </div>
   
  <div class="shipping-grid">
    <div class="shipping-details-column">
      <div class="shipping-title">
        <h1>Shipping Details</h1>
      </div>

    <form id="shipping-form" class="shipping-form">
        <!-- Name Row -->
        <div class="form-row two-columns">
            <input type="text" id="first-name" placeholder="First Name" required>
            <input type="text" id="last-name" placeholder="Last Name" required>
        </div>

        <!-- Address Fields -->
        <div class="form-row">
            <input type="text" id="address" placeholder="Address" required>
        </div>
        <div class="form-row">
            <input type="text" id="address2" placeholder="Address 2">
        </div>

        <!-- Country / City Row -->
        <div class="form-row two-columns">
            <div class="select-wrapper">
                <select id="country" required>
                    <option value="" disabled selected hidden>Country</option>
                    <option value="US">United States</option>
                    <option value="CA">Canada</option>
                    <option value="UK">United Kingdom</option>
                    <option value="AU">Australia</option>
                </select>
            </div>
            <input type="text" id="city" placeholder="City" required>
        </div>

        <!-- Zip / Phone Row -->
        <div class="form-row two-columns">
            <input type="text" id="zip-code" placeholder="Zip/Postal Code" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
        </div>

        <!-- Shipping Options -->
        <div class="form-row shipping-options">
            <label class="shipping-box" id="free-shipping-box">
                <input type="checkbox" name="shipping-method" id="free-shipping-btn" value="free">
                <div class="checkbox-content">
                    <span class="title">Free Shipping</span>
                    <span class="subtext">Between 2 - 5 working days</span>
                </div>
            </label>

            <label class="shipping-box" id="next-day-box">
                <input type="checkbox" name="shipping-method" value="next-day">
                <div class="checkbox-content">
                    <span class="title">Next Day Delivery - $20</span>
                    <span class="subtext">24 hours from checkout</span>
                </div>
            </label>
        </div>

         <!-- Navigation Buttons -->
    
        <div class="action-buttons">
          <div class="next-btn-container-large">
            <button type="submit" id="btn-next" class="next-btn-large">Next</button>
          </div>

          <div class="cancel-btn-container-large">
            <button type="button" class="cancel-btn-large" onclick="history.back()">Go Back</button>
          </div>
        </div> 

    </form>
    </div>

    <div class="shipping-summary-column">
      <div class="summary-title">
        <h1>Summary</h1>
      </div>
      <div class="items-grid">
        <div class="shipping-item-image">
          <img src="images/05 waterproof_ski.jpg" alt="Ski Pants" width="100">
        </div>
        <div class="shipping-item-details">
          <h3>Ski Pants</h3>
          <h3><span>$<span class="item-total">199.00</span></span></h3>
        </div>
        <div class="shipping-item-image">
          <img src="images/02 hiking_boot.jpg" alt="Hiking Boots" width="100">
        </div>
        <div class="shipping-item-details">
          <h3>Hiking Boots</h3>
          <h3><span>$<span class="item-total">299.00</span></span></h3>
        </div>
      </div>
        <div class="voucher">
          <h3>HAVE A VOUCHER?</h3>
        </div>
        <div class="shipping-totals">
          <div class="amounts">
          <span>SUBTOTAL</span>
          <div class="subtotal-section">$<span id="sub-total"></span></div>
        </div>
        <div class="amounts">
          <span>SHIPPING</span>
          <div class="shipping-section">$<span id="shipping-total">50.00</span></div>
        </div>
        <div class="amounts">
          <span>TAXES</span>
          <div class="tax-section">$<span id="tax-total"></span></div>
        </div>
      </div>
      <div class="amounts">
        <h1><span>TOTAL</span></h1>
        <div class="total-section">$<span id="grand-total"></span></div>
      </div>
        </div>
        <div class="shipping-grand-total">

        </div>
    </div>
  </div>



</main>

<!-- Footer -->

<footer class="footer">

  <div class="standard-footer-nav">

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <span class="divider">|</span>
        <a href="#">About</a>
        <span class="divider">|</span>
        <a href="shop-page.html">Shop</a>
        <span class="divider">|</span>
        <a href="#">Help</a>

  </div>

  <div class="standard-footer-trademark">
    <h4>&copy; Aotearoa Adventure Gear</h4>
  </div>
       
</footer>


</body>
</html>
